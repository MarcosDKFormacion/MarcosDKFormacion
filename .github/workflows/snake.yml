name: Generate Snake Animation

on:
  # Se ejecuta automáticamente cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

  # Se ejecuta cuando haces push a main (útil para la primera vez)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Genera el SVG de la serpiente (versión completa, no svg-only)
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: MarcosDKFormacion
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Sube los archivos generados a la rama 'output'
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
